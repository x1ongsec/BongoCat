name: BongoCat Windows Artifacts

# 手动触发：推到你的 fork 后，在 Actions 页选择本 workflow -> Run workflow -> 选择分支。
# 仅构建 Windows exe/NSIS 安装包并上传为 Artifact；不发布 GitHub Release，
# 不依赖仓库 Secrets（临时关闭 updater 签名产物）。
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 需要更多架构时，在此追加：
        #   - target: i686-pc-windows-msvc
        #   - target: aarch64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      # 图标未入库（.gitignore），构建前需先生成
      - name: Generate app icons
        run: pnpm build:icon

      - name: Build Windows app
        run: pnpm tauri build --target ${{ matrix.target }} --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bongo-cat.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
